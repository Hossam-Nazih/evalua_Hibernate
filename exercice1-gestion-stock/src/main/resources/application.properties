# Connexion lue par ma.projet.util.HibernateUtil

# --- H2 en memoire (par defaut) : rien a installer, la base est recreee a chaque lancement ---
hibernate.connection.driver_class=org.h2.Driver
hibernate.connection.url=jdbc:h2:mem:gestion_stock;DB_CLOSE_DELAY=-1
hibernate.connection.username=sa
hibernate.connection.password=
hibernate.dialect=org.hibernate.dialect.H2Dialect

