# Parametres Hibernate charges par ma.projet.util.HibernateUtil

# base H2 en memoire, conservee tant que la JVM tourne
# console web : http://localhost:8082  (JDBC URL jdbc:h2:mem:etat_civil, utilisateur sa, mot de passe vide)
hibernate.connection.driver_class=org.h2.Driver
hibernate.connection.url=jdbc:h2:mem:etat_civil;DB_CLOSE_DELAY=-1
hibernate.connection.username=sa
hibernate.connection.password=
hibernate.dialect=org.hibernate.dialect.H2Dialect

# schema genere depuis les annotations des entites
hibernate.hbm2ddl.auto=update
# mettre a true pour voir le SQL envoye a H2
hibernate.show_sql=false
hibernate.format_sql=true
